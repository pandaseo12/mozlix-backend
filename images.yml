name: Build MOZLIX images
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/pandaseo12/mozlix-api:bunny-v1
          labels: org.opencontainers.image.source=https://github.com/pandaseo12/mozlix-backend
      - name: Build Stealth
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/annurdien/stealth.git#e664a0e4e2c46f5464bc74e97680e9fe82c52bb4
          push: true
          tags: ghcr.io/pandaseo12/mozlix-stealth:bunny-v1
          labels: org.opencontainers.image.source=https://github.com/pandaseo12/mozlix-backend
